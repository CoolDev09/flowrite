[package]
name = "flowwrite"
version = "0.1.0"
edition = "2021"
description = "A fast, Notion-inspired desktop writing workspace"

[dependencies]
eframe = "0.29"
printpdf = "0.7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
