[package]
name = "flowrite"
version = "0.2.4"
edition = "2021"
description = "A fast, Notion-inspired desktop writing workspace"

[dependencies]
eframe = "0.29"
egui_extras = { version = "=0.29.1", default-features = false, features = ["svg"] }
printpdf = "0.7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nlprule = "=0.6.4"
spellbook = "=0.4.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = { version = "3.6", features = ["image-data"] }
zip = { version = "0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
nlprule-build = "=0.6.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
